[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
; Serial2 receives ATmega TX through the existing PCB divider on GPIO15.
; No extra libraries: WiFi, WebServer and HardwareSerial are part of Arduino-ESP32.
upload_port = COM4
monitor_port = COM4